name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish to npm (OIDC)
    if: ${{ github.server_url == 'https://github.com' && github.repository == 'kellertobias/markdown-docgen' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run ci
      - name: Publish package
        run: npm publish --access public
      - name: Derive npm version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published to npm: https://www.npmjs.com/package/@tobisk/markdown-manuals/v/${{ steps.version.outputs.version }}
