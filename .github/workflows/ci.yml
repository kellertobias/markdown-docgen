name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run example
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "dist/cli.js" pack.txt
          grep -q "examples/basic/manual.config.json" pack.txt
      - name: Smoke-test packed CLI
        run: |
          PKG=$(npm pack --silent)
          TMP=$(mktemp -d)
          cp "$PKG" "$TMP/"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "./$PKG" >/dev/null
          npx markdown-manual --help
